# Beispiel: Samba als Mitglied einer Domäne (Grundzüge). Erfundene Namen. NICHT als Domänenmitglied ausgeführt: es gab keinen Domänencontroller.
[global]
 workgroup = LAB
 realm = LAB.EXAMPLE
 security = ads
 kerberos method = secrets and keytab
 idmap config * : backend = tdb
 idmap config * : range = 3000-7999
 idmap config LAB : backend = rid
 idmap config LAB : range = 10000-999999
 winbind use default domain = yes
 template shell = /usr/sbin/nologin

[daten]
 path = /srv/daten
 read only = no
